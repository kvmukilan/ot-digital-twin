[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-digital-twin"
version = "1.0.0"
description = "OT Digital Twin & LLM Attack Simulator — Modbus TCP environment with MITRE ATT&CK mapping"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pymodbus>=3.6,<4.0",
    "langchain>=0.2,<1.0",
    "langchain-openai>=0.1,<1.0",
    "langchain-community>=0.2,<1.0",
    "openai>=1.0,<2.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<14.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
ot-twin = "ot_twin.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["ot_twin*"]
